name: Cursor Weekly Pipeline

permissions:
  contents: write

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 3 AM UTC (~8:30 AM IST)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repo
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install

      # --------------------------------------------------
      # 4. Restore session (IMPORTANT)
      # --------------------------------------------------
      - name: Restore Cursor session
        run: |
          echo "${{ secrets.CURSOR_STATE }}" | base64 --decode > state_fixed.json

      # --------------------------------------------------
      # 5. Run pipeline
      # --------------------------------------------------
      - name: Run pipeline
        run: |
          python src/pipeline.py

      - name: Prepare GitHub Pages file
        run: |
          mkdir -p docs
          cp output/latest/leaderboard.html docs/index.html

      # --------------------------------------------------
      # 6. Commit results (data + output)
      # --------------------------------------------------
      - name: Commit and push results
        run: |
          git config --global user.name "automation-bot"
          git config --global user.email "bot@users.noreply.github.com"

          git add data/ output/ logs/ docs/
          git commit -m "Auto update weekly leaderboard" || echo "No changes to commit"

          git push
